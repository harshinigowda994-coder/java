<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>time table</title>

<body>
        <form method="get">
        <label for="name">First Name:</label>
        <input type="text" name="fname"> <br> <br>

        <label for="lname">Last Name:</label>
        <input type="text" name="lname"> <br> <br>

        <input type="email" name="email"> <br> <br>

        <input type="radio" name="gender" value="male">

        <label for="male">Male</label>
        <input type="radio" name="gender" value="female">

        <label for="female">Female</label>

        <label for="phone">Phone:</label>
        <input type="tel" name="phone" placeholder="whatsapp Number"><br><br>

<label for="city">City:</label>

<input type="text" name="city"><br><br>

<label for="lang">Languages Known: </label>

<input type="checkbox" name="languages" value="java">

<label for="java">Java</label>

<input type="checkbox" name="languages" value="python">

<label for="python"> Python</label>

<input type="checkbox" name="languages" value="javascript">

<label for="javascript">JavaScript</label>

<button type="reset">Reset</button>

<button type="submit">Submit</button>
</form>
